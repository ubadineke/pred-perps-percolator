[package]
name = "moxie-bootstrap"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
percolator-prog = { path = "../../vendor/percolator-prog", default-features = false, features = ["no-entrypoint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "1.18.26"
solana-sdk = "1.18.26"
spl-associated-token-account = "2.3.0"
spl-token = { version = "4.0", features = ["no-entrypoint"] }

